# ===== ВСЕ НАСТРОЙКИ ЗДЕСЬ. Код трогать не нужно. =====
# Время рассылки: send_time ниже (по Екатеринбургу) или кнопка «Время отправки» в админ-меню бота.
# GitHub каждый час проверяет, не пора ли слать. В какие дни недели какой выпуск уходит, задаётся ниже в поле days.

defaults:                      # действует для всех выпусков, если не переопределено
  timezone: Asia/Yekaterinburg
  send_time: "18:00"           # во сколько слать (ЧЧ:ММ по Екатеринбургу); кнопка в боте важнее
  period_days: 7               # за сколько дней брать новости
  news_per_topic: "3"          # сколько новостей в разделе
  max_items_per_topic: 20      # сколько заголовков отдавать модели
  language: русский
  style: "очень коротко: яркий заголовок и одно короткое предложение, без канцелярита"
  emoji_per_news: true         # эмодзи перед каждой новостью
  show_date: true              # дата в заголовке
  channels: [telegram]         # куда слать в паблик: telegram, email
  pause_seconds: 8             # пауза между разделами (чтобы не упереться в лимиты модели)

digests:
  monday:                      # имя выпуска (его же можно вписать при ручном запуске)
    title: Новости недели — мир и Россия
    days: [mon]                # mon tue wed thu fri sat sun
    footer: "Удачной недели! 🍀"
    subscribers: global        # подписчикам бота уходит та же подборка
    topics:
      - name: Мир
        emoji: "🌍"
        queries: ["мировые новости", "международные новости"]
      - name: Россия
        emoji: "🇷🇺"
        queries: ["новости России", "главные новости России"]

  wednesday:
    title: Яркие события на территории Уральского банка
    regional_title: Яркие события региона
    days: [wed]
    subscribers: regional      # каждому подписчику своя подборка по его региону
    topics:                    # версия для паблика: весь Урал сразу
      - name: Афиша Урала
        emoji: "✨"
        queries: ["афиша Урал события", "афиша Екатеринбург", "афиша Челябинск", "афиша Уфа", "афиша Тюмень"]
        hint: "это афиша: что, где и когда проходит, если это есть в данных"
    regional_topics:           # версия для подписчика; {region} и {city} подставляются сами
      - name: События региона
        emoji: "✨"
        queries: ["афиша {city}", "{region} события фестивали выставки концерты"]
        hint: "это афиша: что, где и когда проходит, если это есть в данных"
        region_feeds: true     # добавить RSS региона из bot.regions.<регион>.feeds

  friday:
    title: Книги, кино и культура
    regional_title: Книги, кино и культура
    days: [fri]
    footer: "Хороших выходных! 🌿"
    subscribers: regional
    topics:
      - name: Книги
        emoji: "📚"
        queries: ["новые книги", "книжные новинки"]
      - name: Кино
        emoji: "🎬"
        queries: ["новинки кино", "премьеры фильмов"]
      - name: Культура
        emoji: "🎭"
        queries: ["культура выставки театры", "культурные события"]
    regional_topics:
      - name: Кино и театры
        emoji: "🎬"
        queries: ["кино афиша {city}", "театр {city} премьера"]
        hint: "это афиша: что и где идёт, если это есть в данных"
      - name: Книги и выставки
        emoji: "📚"
        queries: ["книги {city} презентация", "выставка {city}"]
        region_feeds: true

# ===== БОТ ПОДПИСКИ (bot.py) =====
# В паблик постится сообщение с кнопками регионов. Нажал кнопку -> открывается бот,
# человек нажимает «Запустить» и подписывается на личную рассылку своего региона.
bot:
  # channel: "@my_public"      # куда постить меню (иначе секрет TG_CHAT_ID)
  menu_text: "📍 Хочешь такие же новости про свой регион в личные сообщения? Выбери регион: откроется бот, нажми «Запустить»."
  choose_text: "📍 Выберите регион, для которого присылать новости:"
  welcome_text: |
    ✅ Готово! Регион: {region}

    Что и когда присылаю (в 18:00 по Екатеринбургу):
    • Понедельник: мир и Россия
    • Среда: яркие события в вашем регионе
    • Пятница: книги, кино и культура региона

    /regions: сменить регион
    /stop: отписаться
  regions:                     # ключ (латиницей) нужен для ссылки-кнопки
    sverdlovsk: {name: "Свердловская область", city: "Екатеринбург"}
    chelyabinsk: {name: "Челябинская область", city: "Челябинск"}
    bashkortostan: {name: "Республика Башкортостан", city: "Уфа", feeds: []}   # feeds: свои RSS региона
    tyumen: {name: "Тюменская область", city: "Тюмень"}
    kurgan: {name: "Курганская область", city: "Курган"}
    khmao: {name: "ХМАО — Югра", city: "Ханты-Мансийск"}
    yanao: {name: "Ямало-Ненецкий АО", city: "Салехард"}
