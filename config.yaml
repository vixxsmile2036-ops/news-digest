# ===== ВСЕ НАСТРОЙКИ ЗДЕСЬ. Код (digest.py) трогать не нужно. =====

defaults:                      # действует для всех дайджестов, если не переопределено ниже
  timezone: Asia/Yekaterinburg
  period_days: 7               # за сколько дней брать новости
  news_per_topic: "3-5"        # сколько новостей в разделе
  max_items_per_topic: 25      # сколько заголовков отдавать модели
  language: русский
  style: "коротко, живо и понятно, простым языком, без канцелярита"
  emoji_per_news: true         # эмодзи перед каждой новостью
  show_date: true              # дата в заголовке
  channels: [telegram, email]  # куда слать: telegram, email или оба

digests:
  weekly:                      # имя дайджеста (для ручного запуска)
    title: Еженедельная подборка новостей
    days: [fri]                # в какие дни слать: mon tue wed thu fri sat sun (убрать строку = каждый день)
    # telegram_chat: "@my_public"   # свой паблик для этого дайджеста (иначе берётся секрет TG_CHAT_ID)
    # mail_to: "a@mail.ru, b@mail.ru"  # свои адресаты (иначе секрет MAIL_TO)
    topics:
      - name: Мир
        emoji: "🌍"
        queries: ["мировые новости", "международные новости"]   # поиск в Google News
        feeds: []                                               # свои RSS-ленты
      - name: Россия
        emoji: "🇷🇺"
        queries: ["новости России", "Екатеринбург"]
      - name: Экономика
        emoji: "💰"
        queries: ["экономика", "Сбер", "Т-Банк"]
      - name: Технологии и ИИ
        emoji: "🤖"
        queries: ["нейросети", "технологии"]
      - name: Архитектура
        emoji: "🏛"
        queries: ["архитектура", "BIM Revit"]

  # Пример второго дайджеста: короткая ежедневная сводка по работе, только в Telegram.
  # Раскомментируйте, чтобы включить.
  # daily_work:
  #   title: Утренняя сводка
  #   period_days: 1
  #   news_per_topic: "2-3"
  #   channels: [telegram]
  #   style: "очень коротко, одно предложение на новость"
  #   topics:
  #     - name: Банки
  #       emoji: "🏦"
  #       queries: ["Сбер", "Т-Банк", "банки"]

# ===== БОТ С ВЫБОРОМ РЕГИОНА (bot.py) =====
# В паблик постится сообщение с кнопками регионов. Нажал кнопку -> бот присылает
# человеку в личку свежие новости и афишу этого региона.
bot:
  # channel: "@my_public"        # куда постить меню (иначе секрет TG_CHAT_ID)
  menu_text: "📍 Выбери регион — пришлю свежую подборку новостей и афишу сюда:"
  period_days: 3
  news_per_topic: "3-5"
  # разделы подборки; {region} и {city} подставляются из региона
  topics:
    - name: Новости региона
      emoji: "📰"
      queries: ["{region} новости", "{city} новости"]
      region_feeds: true         # добавить RSS региона (feeds ниже)
    - name: Афиша
      emoji: "🎭"
      queries: ["афиша {city}", "{city} концерты выставки спектакли"]
      hint: "это афиша: укажи что, где и когда проходит, если это есть в данных"
  regions:                       # ключ (латиницей) нужен для ссылки-кнопки
    sverdlovsk: {name: "Свердловская область", city: "Екатеринбург"}
    chelyabinsk: {name: "Челябинская область", city: "Челябинск"}
    bashkortostan: {name: "Республика Башкортостан", city: "Уфа", feeds: []}   # feeds: свои RSS региона
    tyumen: {name: "Тюменская область", city: "Тюмень"}
    kurgan: {name: "Курганская область", city: "Курган"}
    khmao: {name: "ХМАО — Югра", city: "Ханты-Мансийск"}
    yanao: {name: "Ямало-Ненецкий АО", city: "Салехард"}
