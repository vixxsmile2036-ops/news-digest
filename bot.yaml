name: Region bot
on:
  schedule:
    - cron: "*/5 * * * *"   # раз в 5 минут принимает подписки
  workflow_dispatch:
    inputs:
      post_menu:
        description: "true = запостить меню с кнопками в паблик"
        required: false
        default: "false"
concurrency:
  group: region-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ github.event.inputs.post_menu }}" = "true" ]; then
            python bot.py --post-menu
          else
            python bot.py --once
          fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
